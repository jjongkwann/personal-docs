[project]
name = "pkb"
version = "0.1.0"
description = "Personal Knowledge Base - RAG 기반 개인 지식 관리 시스템"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "elasticsearch>=8.17,<9",
    "sentence-transformers>=3.0",
    "tiktoken>=0.8",
    "pyyaml>=6.0",
    "typer>=0.15",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "mcp>=2.0,<3",
    "markitdown[pdf,docx,pptx,xlsx]>=0.1",
    "pdfminer-six>=20231228",
]

[project.scripts]
pkb = "pkb.cli:app"

[dependency-groups]
dev = [
    "ruff>=0.9",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pkb"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/pkb/cli.py" = ["B008", "A001"]

[tool.pytest.ini_options]
markers = [
    "integration: 실제 로컬 Elasticsearch가 필요하며 PKB_ES_INTEGRATION=1일 때만 실행",
]

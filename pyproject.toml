[project]
name = "pkb"
version = "0.1.0"
description = "Personal Knowledge Base - RAG 기반 개인 지식 관리 시스템"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "elasticsearch>=8.17,<9",
    # 6.1부터 이미지·오디오 입력과 config_kwargs로 모달리티 인코더를 빼고 올리기 (EmbeddingGemma 2)
    "sentence-transformers>=6.1",
    "tiktoken>=0.8",
    "pyyaml>=6.0",
    "typer>=0.15",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "mcp>=2.0,<3",
    "httpx>=0.28",
    "markitdown[pdf,docx,pptx,xlsx]>=0.1",
    "pdfminer-six>=20231228",
    "peft>=0.21.2",
    # 5.13 미만은 원격 코드 모델(jina v5)을 한 프로세스에서 다시 올리면 AttributeError가 난다 (유휴 해제 뒤 재적재)
    "transformers>=5.13",
    # EmbeddingGemma 2의 프로세서가 텍스트만 올려도 이미지 프로세서(torchvision)를 불러온다
    "torchvision>=0.26,<0.27",
]

[project.scripts]
pkb = "pkb.cli:app"

[dependency-groups]
dev = [
    "ruff>=0.9",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pkb"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/pkb/cli.py" = ["B008", "A001"]

[tool.pytest.ini_options]
markers = [
    "integration: 실제 로컬 Elasticsearch가 필요하며 PKB_ES_INTEGRATION=1일 때만 실행",
]
